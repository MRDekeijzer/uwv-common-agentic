name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: agentskills.io-spec
        run: gh skill publish --dry-run
        env:
          GH_TOKEN: ${{ github.token }}
      - name: plugin manifests
        run: for f in plugin.json .github/plugin/marketplace.json; do python3 -m json.tool "$f" > /dev/null; done
      - run: python3 scripts/validate_skills.py --selftest
      - run: python3 scripts/validate_skills.py --check
